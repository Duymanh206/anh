<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Open Graph / Meta SEO -->
    <meta name="title" content="Gửi Ánh Tuyết - Chúc Mừng 20/10 🌸">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Gửi Ánh Tuyết - Chúc Mừng 20/10 🌸">
    <meta property="og:description" content="Chạm vào bó hoa ma thuật để khám phá Ngân hà Điều Ước 3D dành riêng cho em!">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gửi Ánh Tuyết - Chúc Mừng 20/10 🌸">
    <meta name="twitter:description" content="Món quà ma thuật 3D ngọt ngào tự tay chuẩn bị dành riêng cho cô bé Ánh Tuyết nhân ngày 20/10 ❤️">
    <meta name="twitter:image" content="assets/bouquet.jpg">
    <meta name="theme-color" content="#1a0926">

    <!-- Google Font 'Mali' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-dark-1: #07040a;
            --bg-dark-2: #1e0a2d;
            --pink-primary: #ff4d8d;
            --pink-glow: #ff2a85;
            --pink-light: #fff0f3;
            --pink-cream: #ffe4eb;
            --gold-accent: #ffd166;
            --text-wine: #7a1f3d;
            --font-family: 'Mali', cursive, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-dark-1) 0%, #150622 50%, var(--bg-dark-2) 100%);
            font-family: var(--font-family);
            color: #ffffff;
            position: relative;
        }

        /* Ambient cosmic radial glow */
        .cosmic-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vmax;
            height: 100vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 105, 180, 0.22) 0%, rgba(138, 35, 115, 0.16) 38%, rgba(20, 5, 30, 0.65) 70%, transparent 95%);
            pointer-events: none;
            z-index: 1;
        }

        /* Starry & firefly background canvas */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Floating Rose Petals Overlay */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .floating-petal {
            position: absolute;
            background: radial-gradient(circle, #ff80ab 20%, #ff4081 100%);
            border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;
            opacity: 0.75;
            filter: drop-shadow(0 0 6px rgba(255, 64, 129, 0.6));
            animation: floatPetal linear infinite;
        }

        @keyframes floatPetal {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        /* ==============================================
           PHASE 1: BÓ HOA MA THUẬT (MÀN HÌNH MỞ ĐẦU)
           ============================================== */
        #phase-bouquet {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            perspective: 1200px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #phase-bouquet.fade-out {
            opacity: 0;
            transform: scale(1.15);
            pointer-events: none;
        }

        /* 3D Parallax Root Stage */
        .bouquet-stage {
            position: relative;
            width: 360px;
            height: 360px;
            max-width: 88vw;
            max-height: 88vw;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @media (min-width: 768px) {
            .bouquet-stage {
                width: 440px;
                height: 440px;
            }
        }

        /* Floating animation for bouquet */
        .bouquet-float-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            animation: floating 4.5s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-14px) rotate(0.8deg);
            }
        }

        /* ==============================================
           AURA & GLOW: HÀO QUANG ĐA LỚP PHÍA SAU BÓ HOA
           ============================================== */
        .bouquet-aura-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(-40px);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        /* Layer 1: Radiant breathing bloom */
        .aura-bloom {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 42, 133, 0.55) 0%, rgba(255, 105, 180, 0.38) 38%, rgba(162, 34, 136, 0.2) 65%, transparent 80%);
            filter: blur(25px);
            animation: aura-breath 3.4s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        @media (min-width: 768px) {
            .aura-bloom {
                width: 470px;
                height: 470px;
                filter: blur(32px);
            }
        }

        @keyframes aura-breath {
            0% {
                transform: scale(0.92);
                opacity: 0.65;
            }
            100% {
                transform: scale(1.18);
                opacity: 0.98;
            }
        }

        /* Layer 2: Rotating sunrays / magical halo */
        .aura-sunrays {
            position: absolute;
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255, 105, 180, 0.28),
                transparent 25deg,
                rgba(255, 192, 224, 0.35) 50deg,
                transparent 80deg,
                rgba(255, 42, 133, 0.32) 115deg,
                transparent 145deg,
                rgba(255, 209, 102, 0.32) 180deg,
                transparent 210deg,
                rgba(255, 105, 180, 0.28) 245deg,
                transparent 275deg,
                rgba(255, 42, 133, 0.35) 310deg,
                transparent 340deg,
                rgba(255, 105, 180, 0.28) 360deg
            );
            filter: blur(14px);
            animation: sunray-spin 26s linear infinite;
            mix-blend-mode: screen;
            opacity: 0.8;
            will-change: transform;
        }

        @media (min-width: 768px) {
            .aura-sunrays {
                width: 530px;
                height: 530px;
            }
        }

        @keyframes sunray-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Layer 3: Celestial starlight orbital ring */
        .aura-orbit-ring {
            position: absolute;
            width: 340px;
            height: 340px;
            border: 1.5px dashed rgba(255, 182, 218, 0.55);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.45), inset 0 0 25px rgba(255, 105, 180, 0.25);
            animation: ring-counter-spin 34s linear infinite;
            opacity: 0.75;
        }

        @media (min-width: 768px) {
            .aura-orbit-ring {
                width: 410px;
                height: 410px;
            }
        }

        @keyframes ring-counter-spin {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Layer 4: Interactive Halo Canvas (Orbiting Sparkles & Fireflies) */
        #bouquet-sparkles-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(10px);
            width: 480px;
            height: 480px;
            pointer-events: none;
            z-index: 5;
        }

        /* ==============================================
           BOUQUET MAIN IMAGE CONTAINER
           ============================================== */
        .bouquet-image-container {
            position: relative;
            width: 285px;
            height: 285px;
            max-width: 76vw;
            max-height: 76vw;
            border-radius: 50%;
            padding: 9px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.45) 0%, rgba(255, 77, 141, 0.18) 60%, transparent 80%);
            box-shadow: 0 0 65px rgba(255, 77, 141, 0.55), inset 0 0 35px rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transform: translateZ(30px);
            transition: box-shadow 0.3s ease;
            z-index: 4;
        }

        @media (min-width: 768px) {
            .bouquet-image-container {
                width: 340px;
                height: 340px;
            }
        }

        .bouquet-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.65));
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        /* SVG Hold Progress Ring */
        .hold-ring-svg {
            position: absolute;
            top: -16px;
            left: -16px;
            width: calc(100% + 32px);
            height: calc(100% + 32px);
            pointer-events: none;
            transform: rotate(-90deg) translateZ(40px);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 6;
        }

        .hold-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.16);
            stroke-width: 4.5;
        }

        .hold-ring-bar {
            fill: none;
            stroke: url(#ring-gradient);
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-dasharray: 880;
            stroke-dashoffset: 880;
            transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 14px #ff2a85);
        }

        /* Holding state */
        .bouquet-stage.holding .bouquet-float-wrap {
            animation: bouquet-shake 0.1s infinite alternate;
        }

        .bouquet-stage.holding .hold-ring-svg {
            opacity: 1;
        }

        .bouquet-stage.holding .bouquet-image-container {
            box-shadow: 0 0 90px rgba(255, 42, 133, 0.95), inset 0 0 45px rgba(255, 255, 255, 0.7);
        }

        @keyframes bouquet-shake {
            0% { transform: translate(2px, 2px) rotate(0.8deg) scale(0.98); }
            50% { transform: translate(-2px, -1.5px) rotate(-0.8deg) scale(0.98); }
            100% { transform: translate(1.5px, -2px) rotate(0.6deg) scale(0.98); }
        }

        /* ==============================================
           CÁC TỪ KHÓA DỄ THƯƠNG BAY LÊN (KEYWORD PILLS)
           ============================================== */
        .keyword-pill {
            position: absolute;
            padding: 9px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 182, 218, 0.75);
            color: #fff0f5;
            font-size: 0.98rem;
            font-weight: 600;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 77, 141, 0.5);
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.9);
            opacity: 0;
            transform: scale(0.2) translate(0, 0) translateZ(50px);
            transition: all 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 8;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* 5 positions around the bouquet */
        .kw-pos-0 { top: -20px; left: -15px; --target-x: -20px; --target-y: -20px; --target-rot: -8deg; }
        .kw-pos-1 { top: -22px; right: -15px; --target-x: 20px; --target-y: -22px; --target-rot: 7deg; }
        .kw-pos-2 { top: 46%; left: -50px; --target-x: -25px; --target-y: 0px; --target-rot: -12deg; }
        .kw-pos-3 { top: 44%; right: -50px; --target-x: 25px; --target-y: 0px; --target-rot: 10deg; }
        .kw-pos-4 { bottom: -20px; left: 50%; transform: translateX(-50%) scale(0.2) translateZ(50px); --target-rot: 0deg; }

        @media (min-width: 768px) {
            .keyword-pill {
                font-size: 1.1rem;
                padding: 10px 22px;
            }
            .kw-pos-0 { top: -28px; left: -35px; }
            .kw-pos-1 { top: -30px; right: -35px; }
            .kw-pos-2 { top: 46%; left: -75px; }
            .kw-pos-3 { top: 44%; right: -75px; }
            .kw-pos-4 { bottom: -26px; }
        }

        .bouquet-stage.popped .keyword-pill {
            opacity: 1;
            transform: scale(1) rotate(var(--target-rot)) translateZ(50px);
        }
        .bouquet-stage.popped .kw-pos-4 {
            transform: translateX(-50%) scale(1) rotate(var(--target-rot)) translateZ(50px);
        }

        /* ==============================================
           GLOWING HINT TEXT & TAPPING HAND ICON
           ============================================== */
        .hint-container {
            margin-top: 38px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 15;
        }

        .hint-text-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 105, 180, 0.6);
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 1.12rem;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: #ffffff;
            /* Rich neon text glow */
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff2a85, 0 0 35px #ff2a85, 0 0 50px #ff4d8d;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 77, 141, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.25);
            animation: pulse-glow 2.2s infinite ease-in-out;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Animated tapping finger icon */
        .hand-tap-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            animation: finger-tap 1.6s ease-in-out infinite;
            filter: drop-shadow(0 0 8px #ff2a85);
        }

        @keyframes finger-tap {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            30% {
                transform: translateY(-5px) scale(1.15) rotate(-8deg);
            }
            50% {
                transform: translateY(3px) scale(0.95) rotate(4deg);
            }
            70% {
                transform: translateY(0) scale(1);
            }
        }

        .hint-sparkle-star {
            color: #ffd166;
            animation: sparkle-rotate 2s linear infinite;
        }

        @keyframes sparkle-rotate {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 77, 141, 0.4);
                border-color: rgba(255, 105, 180, 0.5);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 77, 141, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.4);
                border-color: rgba(255, 105, 180, 0.95);
                transform: scale(1.035);
            }
        }

        .hint-subtext {
            font-size: 0.9rem;
            color: rgba(255, 230, 245, 0.75);
            letter-spacing: 0.4px;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }

        /* Burst overlay during transition */
        #burst-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 182, 218, 0.95) 0%, rgba(255, 42, 133, 0.88) 50%, rgba(26, 9, 38, 0.98) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.6s ease;
        }

        #burst-overlay.active {
            opacity: 1;
        }

        /* ==============================================
           PHASE 2: NGÂN HÀ ĐIỀU ƯỚC 3D (3D WISHING GALAXY)
           ============================================== */
        #phase-galaxy {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #phase-galaxy.active {
            opacity: 1;
            pointer-events: auto;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI Overlays in Phase 2 */
        .galaxy-ui-top {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 30;
        }

        .glass-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 105, 180, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .glass-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 77, 141, 0.6);
            border-color: rgba(255, 105, 180, 0.7);
        }

        .glass-btn:active {
            transform: scale(0.94);
        }

        .glass-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        /* Heartbeat Pulse for Letter Button */
        .heartbeat-btn {
            animation: envelope-pulse 1.6s infinite ease-in-out;
            background: rgba(255, 105, 180, 0.2);
            border-color: rgba(255, 105, 180, 0.5);
        }

        @keyframes envelope-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 105, 180, 0.3);
            }
            15% {
                transform: scale(1.15);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 25px rgba(255, 42, 133, 0.7);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 42, 133, 0.55);
            }
        }

        .badge-pulse {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff2a85;
            box-shadow: 0 0 8px #ff2a85;
            animation: badge-pulse-anim 1.5s infinite;
        }

        @keyframes badge-pulse-anim {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        /* Bottom hint badge in Phase 2 */
        .galaxy-hint-bottom {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 8, 32, 0.68);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 105, 180, 0.3);
            padding: 8px 22px;
            border-radius: 999px;
            font-size: 0.86rem;
            color: rgba(255, 235, 245, 0.9);
            pointer-events: none;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.3px;
            text-align: center;
            max-width: 90vw;
            white-space: nowrap;
        }

        .galaxy-hint-bottom svg {
            width: 16px;
            height: 16px;
            fill: #ff69b4;
            flex-shrink: 0;
        }

        /* ==============================================
           POPUP: BỨC THƯ TÌNH DÀNH RIÊNG CHO ÁNH TUYẾT
           ============================================== */
        .letter-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 4, 18, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .letter-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;

        .audio-muted .audio-bar {
            animation: none !important;
            height: 4px !important;
            opacity: 0.5;
        }

        @keyframes sound-bar {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }

        /* ==============================================

        .crystal-lightbox {

    <!-- ==============================================
         JAVASCRIPT LOGIC & CẤU HÌNH (CONFIG)
         ============================================== -->
    <script>
        /* =========================================================================
           V. CẤU HÌNH DỄ DÀNG THAY ĐỔI (CONFIG)

        const CONFIG = {
            crushName: "Ánh Tuyết",
            bouquetImage: 'assets/bouquet.jpg',
            // Ưu tiên file bài hát bạn vừa thêm vào assets
            musicUrl: 'assets/chờ chút....mp3',

            keywords: [
                { text: "Xinh đẹp", icon: "🌸" },
                { text: "Đáng yêu", icon: "💖" },
                { text: "Vui vẻ", icon: "☀️" },
                { text: "Hồn nhiên", icon: "🎀" },
                { text: "May mắn", icon: "🍀" }
            ],

            // 12-14 Tấm thiệp pha lê (Glassmorphism Cards) bay trong không gian 3D
            crystalCards: [
                { icon: "🌸", title: "Ánh Tuyết Nhỏ", subtitle: "Cô bé tháng 10", message: "Nụ cười của em chính là điều ngọt ngào và rạng rỡ nhất ✨" },
                { icon: "✨", title: "Đáng Yêu", subtitle: "Tỏa sáng lung linh", message: "Mong em luôn hồn nhiên, vui tươi và không muộn phiền 🌷" },
                { icon: "🌙", title: "Ánh Sao Đêm", subtitle: "Bình yên mỗi tối", message: "Chúc màn đêm luôn ôm ấp em bằng những giấc mơ thật đẹp 💫" },
                { icon: "🌷", title: "Dịu Dàng", subtitle: "Những điều tốt lành", message: "Mong tất cả những điều dịu dàng nhất của thế giới sẽ tìm đến em 💖" },
                { icon: "🎀", title: "Hồn Nhiên", subtitle: "Luôn là chính em", message: "Hãy cứ vô tư cười thật nhiều, em lúc nào cũng rất dễ thương 🌸" },
                { icon: "🍀", title: "May Mắn", subtitle: "Vạn sự hanh thông", message: "Chúc em học tập thật tốt, gặp nhiều điều suôn sẻ và bình an 🍀" },
                { icon: "☀️", title: "Nụ Cười Tươi", subtitle: "Nắng mai ấm áp", message: "Hôm nay của cô nhóc thế nào? Nhớ lúc nào cũng cười thật tươi nhé ☀️" },
                { icon: "🧸", title: "Bình Yên", subtitle: "Luôn có anh ở đây", message: "Bất cứ khi nào mệt mỏi, hãy nhớ luôn có người sẵn sàng lắng nghe em 🧸" },
                { icon: "🧁", title: "Ngọt Ngào", subtitle: "20/10 trọn vẹn", message: "Chúc em một ngày 20/10 ngập tràn niềm vui, hoa và những món quà xinh xắn 🍰" },
                { icon: "🌟", title: "Tỏa Sáng", subtitle: "Điều đặc biệt", message: "Em là một cô bé vô cùng đặc biệt và đáng quý trong mắt anh 🌟" },
                { icon: "💌", title: "Món Quà Nhỏ", subtitle: "Dành riêng cho em", message: "Trang web nhỏ này được làm riêng tặng cô bé Ánh Tuyết nhân ngày 20/10 ❤️" },
                { icon: "🌈", title: "Hạnh Phúc", subtitle: "Mỗi ngày đều vui", message: "Mong mọi bước đường em đi đều ngập tràn hoa hồng và tiếng cười 🌈" }
            ],

            // Các câu chúc Neon 3D bay trong Ngân hà
            greetings: [
                "Chúc cô bé Ánh Tuyết 20/10 ngập tràn niềm vui ✨",
                "Luôn giữ nụ cười tươi và sự hồn nhiên này nhé",
                "Mong mọi điều dịu dàng nhất sẽ đến với em",

                "Học tập thật tốt và luôn yêu đời nhé"
            ],

            // Bức thư gửi riêng cho Ánh Tuyết
            letter: {
                title: "Gửi Ánh Tuyết nhỏ,",
                content: "Nhân ngày 20/10, anh có một món quà nhỏ tự tay chuẩn bị dành tặng cho cô bé. Chúc Ánh Tuyết của anh luôn xinh đẹp, rạng rỡ, học thật giỏi và lúc nào cũng cười tươi thế này nhé. Mong rằng mọi điều tốt đẹp nhất sẽ luôn ở bên em!",
                signature: "Từ một người luôn quan tâm em ✨"
            }
        };

        /* =========================================================================
           1. BỐI CẢNH & PHÔNG NỀN: SAO LẤP LÁNH, SAO BĂNG & CÁNH HOA BAY
           ========================================================================= */
        const starsCanvas = document.getElementById('stars-canvas');
        const starsCtx = starsCanvas.getContext('2d');
        let stars = [];
        let shootingStars = [];

        function resizeStarsCanvas() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.min(180, Math.floor((starsCanvas.width * starsCanvas.height) / 6000));
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * starsCanvas.width,
                    y: Math.random() * starsCanvas.height,
                    radius: Math.random() * 1.6 + 0.4,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.02 + 0.008,
                    color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#ffd2e8' : '#ffe8a3')
                });
            }
        }

        function spawnShootingStar() {
            const startX = Math.random() * starsCanvas.width * 0.85;
            const startY = Math.random() * starsCanvas.height * 0.35;
            const length = Math.random() * 90 + 80;
            const angle = (Math.PI / 4) + (Math.random() * 0.2 - 0.1);
            shootingStars.push({
                x: startX,
                y: startY,
                length: length,
                speed: Math.random() * 5 + 6,
                angle: angle,
                opacity: 1,
                decay: Math.random() * 0.015 + 0.012
            });
        }

        function renderStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);

            // Twinkling stars
            for (let star of stars) {
                star.alpha += star.speed;
                const currentAlpha = Math.abs(Math.sin(star.alpha));
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                starsCtx.fillStyle = star.color;
                starsCtx.globalAlpha = currentAlpha;
                starsCtx.shadowBlur = star.radius > 1.2 ? 6 : 0;
                starsCtx.shadowColor = star.color;
                starsCtx.fill();
            }

            // Shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                const endX = s.x - Math.cos(s.angle) * s.length;
                const endY = s.y - Math.sin(s.angle) * s.length;

                const grad = starsCtx.createLinearGradient(s.x, s.y, endX, endY);
                grad.addColorStop(0, `rgba(255, 255, 255, ${s.opacity})`);
                grad.addColorStop(0.35, `rgba(255, 105, 180, ${s.opacity * 0.85})`);
                grad.addColorStop(1, `rgba(255, 105, 180, 0)`);

                starsCtx.beginPath();
                starsCtx.moveTo(s.x, s.y);
                starsCtx.lineTo(endX, endY);
                starsCtx.strokeStyle = grad;
                starsCtx.lineWidth = 2.4;
                starsCtx.lineCap = 'round';
                starsCtx.globalAlpha = 1;
                starsCtx.shadowBlur = 10;
                starsCtx.shadowColor = '#ff2a85';
                starsCtx.stroke();

                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.opacity -= s.decay;

                if (s.opacity <= 0 || s.x > starsCanvas.width + 100 || s.y > starsCanvas.height + 100) {
                    shootingStars.splice(i, 1);
                }
            }

            if (Math.random() < 0.016 && shootingStars.length < 3) {
                spawnShootingStar();
            }

            starsCtx.globalAlpha = 1;
            starsCtx.shadowBlur = 0;
            requestAnimationFrame(renderStars);

        const bouquetSparklesCanvas = document.getElementById('bouquet-sparkles-canvas');
        const bCtx = bouquetSparklesCanvas.getContext('2d');
        let bouquetMotes = [];

        function initBouquetSparkles() {
            bouquetSparklesCanvas.width = 480;
            bouquetSparklesCanvas.height = 480;
            bouquetMotes = [];
            const count = 32;

            for (let i = 0; i < count; i++) {
                bouquetMotes.push({
                    angle: Math.random() * Math.PI * 2,
                    radiusX: 135 + Math.random() * 75,
                    radiusY: 120 + Math.random() * 65,
                    speed: (Math.random() * 0.012 + 0.008) * (Math.random() > 0.5 ? 1 : -1),
                    size: Math.random() * 2.8 + 1.2,
                    color: Math.random() > 0.4 ? '#ff69b4' : (Math.random() > 0.5 ? '#ffd166' : '#ffffff'),
                    pulseSpeed: Math.random() * 0.04 + 0.02,
                    pulseVal: Math.random() * Math.PI,
                    tilt: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function renderBouquetSparkles() {
            bCtx.clearRect(0, 0, 480, 480);
            const cx = 240;
            const cy = 240;

            for (let m of bouquetMotes) {
                m.angle += m.speed;
                m.pulseVal += m.pulseSpeed;
                const alpha = Math.abs(Math.sin(m.pulseVal)) * 0.75 + 0.25;

                // Elliptical orbit with tilt
                const rawX = Math.cos(m.angle) * m.radiusX;
                const rawY = Math.sin(m.angle) * m.radiusY;
                const x = cx + rawX * Math.cos(m.tilt) - rawY * Math.sin(m.tilt);
                const y = cy + rawX * Math.sin(m.tilt) + rawY * Math.cos(m.tilt);

                bCtx.beginPath();
                bCtx.arc(x, y, m.size, 0, Math.PI * 2);
                bCtx.fillStyle = m.color;
                bCtx.globalAlpha = alpha;
                bCtx.shadowBlur = 10;
                bCtx.shadowColor = m.color;
                bCtx.fill();
            }

            bCtx.globalAlpha = 1;
            bCtx.shadowBlur = 0;
            requestAnimationFrame(renderBouquetSparkles);
        }

        let targetTiltX = 0;

        // Mouse Move Parallax
        window.addEventListener('mousemove', (e) => {
            if (phaseBouquet.style.display === 'none') return;
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = (e.clientY / window.innerHeight) * 2 - 1;
            targetTiltX = -y * 15; // pitch
            targetTiltY = x * 15;  // yaw
        });

        // Mobile Device Orientation Gyroscope
        window.addEventListener('deviceorientation', (e) => {
            if (phaseBouquet.style.display === 'none') return;
            if (e.gamma !== null && e.beta !== null) {
                targetTiltY = Math.max(-18, Math.min(18, e.gamma * 0.45));
                targetTiltX = Math.max(-18, Math.min(18, (e.beta - 45) * 0.35));
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (phaseBouquet.style.display === 'none') return;
            if (e.touches && e.touches[0]) {
                const x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                const y = (e.touches[0].clientY / window.innerHeight) * 2 - 1;
                targetTiltX = -y * 14;
                targetTiltY = x * 14;

        }, { passive: true });

            if (phaseBouquet.style.display !== 'none') {

                // Tilt the 3D bouquet stage

                let ease = 1 - Math.pow(1 - p, 3);
                camera.position.z = 340 - (110 * ease);
                camera.position.y = 70 - (35 * ease);
                if (p < 1) requestAnimationFrame(glideCam);

            requestAnimationFrame(glideCam);

        // Stardust & Fireflies in 3D
        function createStardustParticles() {
            const particleCount = 800;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorPalette = [
                new THREE.Color(0xff4d8d),
                new THREE.Color(0xff99bb),
                new THREE.Color(0xffd166),
                new THREE.Color(0xffffff)
            ];

            for (let i = 0; i < particleCount; i++) {
                const radius = 60 + Math.random() * 260;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.7;
                positions[i * 3 + 2] = radius * Math.cos(phi);

                const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const pCanvas = document.createElement('canvas');
            pCanvas.width = 64;
            pCanvas.height = 64;
            const pCtx = pCanvas.getContext('2d');
            const grad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 120, 180, 0.85)');
            grad.addColorStop(1, 'rgba(255, 120, 180, 0)');
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, 64, 64);

            const pTexture = new THREE.CanvasTexture(pCanvas);

            const material = new THREE.PointsMaterial({
                size: 5.5,
                map: pTexture,
                transparent: true,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            starParticles = new THREE.Points(geometry, material);
            scene.add(starParticles);
        }

        // 12-14 Crystal Glassmorphism Cards in 3D
        function createCrystalGlassCards() {
            const cards = CONFIG.crystalCards;
            const total = cards.length;

            cards.forEach((card, index) => {
                const phi = Math.acos(-1 + (2 * index) / total);
                const theta = Math.sqrt(total * Math.PI) * phi;
                const radius = 135 + (index % 3) * 14;

                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi) * 0.75;
                const z = radius * Math.cos(phi);

                const cardCanvas = document.createElement('canvas');
                cardCanvas.width = 400;
                cardCanvas.height = 510;

                drawCrystalCard(ctx, card);

                const cardTexture = new THREE.CanvasTexture(cardCanvas);
                const geometry = new THREE.PlaneGeometry(28, 35);
                const material = new THREE.MeshBasicMaterial({
                    map: cardTexture,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.95
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);

        function drawCrystalCard(ctx, card) {
            ctx.clearRect(0, 0, 400, 510);

            // Card frosted background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 400, 510);
            bgGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
            bgGrad.addColorStop(0.5, 'rgba(255, 182, 218, 0.18)');
            bgGrad.addColorStop(1, 'rgba(255, 105, 180, 0.28)');
            ctx.fillStyle = bgGrad;
            ctx.beginPath();
            ctx.roundRect(14, 14, 372, 482, 24);
            ctx.fill();

            // Glowing Outer Pink Stroke
            ctx.strokeStyle = '#ff69b4';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#ff2a85';
            ctx.shadowBlur = 16;
            ctx.stroke();

            // Inner Hairline Stroke
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(18, 18, 364, 474, 20);
            ctx.stroke();

            // Card Icon Circle
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.arc(200, 110, 48, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffd1dc';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Emoji / Icon
            ctx.font = '54px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(card.icon, 200, 114);

            // Title
            ctx.font = 'bold 30px Mali, cursive, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ff2a85';
            ctx.shadowBlur = 10;
            ctx.fillText(card.title, 200, 200);

            // Subtitle
            ctx.shadowBlur = 0;
            ctx.font = '600 20px Mali, cursive, sans-serif';
            ctx.fillStyle = '#ffd166';
            ctx.fillText(card.subtitle, 200, 238);

            // Divider line with sparkling stars
            const divGrad = ctx.createLinearGradient(80, 265, 320, 265);
            divGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            divGrad.addColorStop(0.5, 'rgba(255, 182, 218, 0.8)');
            divGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.strokeStyle = divGrad;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(80, 265);
            ctx.lineTo(320, 265);
            ctx.stroke();

            // Message text (Word wrap)
            ctx.font = '400 20px Mali, cursive, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 6;
            wrapText(ctx, card.message, 200, 315, 310, 32);

            // Bottom decorative tag
            ctx.font = '600 16px Mali, cursive, sans-serif';
            ctx.fillStyle = '#ffb3d9';
            ctx.shadowBlur = 0;
            ctx.fillText('20/10 • Ánh Tuyết 🌸', 200, 455);
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, currentY);
        }

                // Inner bright core

        // Extruded 3D Hearts Floating in Space
        function createExtrudedHearts() {
            const heartShape = new THREE.Shape();
            const x = 0, y = 0;
            heartShape.moveTo(x + 5, y + 5);
            heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
            heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
            heartShape.bezierCurveTo(x - 6, y + 11, x - 2, y + 15.4, x + 5, y + 19);
            heartShape.bezierCurveTo(x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7);
            heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
            heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

            const extrudeSettings = {
                depth: 2,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.8,
                bevelThickness: 0.8
            };

            const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            heartGeometry.center();

            const heartColors = [0xff3366, 0xff69b4, 0xff1493, 0xffaacc];

            for (let i = 0; i < 30; i++) {
                const color = heartColors[i % heartColors.length];
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: 0x330011,
                    specular: 0xffffff,
                    shininess: 90
                });

                const heart = new THREE.Mesh(heartGeometry, material);
                const radius = 65 + Math.random() * 160;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                heart.position.set(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta) * 0.7,
                    radius * Math.cos(phi)
                );

                const scale = 0.55 + Math.random() * 0.65;
                heart.scale.set(scale, -scale, scale);

                heart.rotation.x = Math.random() * Math.PI;
                heart.rotation.y = Math.random() * Math.PI;

                heart.userData = {
                    initialY: heart.position.y,
                    rotSpeedX: (Math.random() - 0.5) * 0.02,
                    rotSpeedY: (Math.random() - 0.5) * 0.02,
                    seed: Math.random() * 10
                };

                scene.add(heart);
                heartMeshes.push(heart);
            }
        }

        // Raycasting for clicking Crystal Cards
        function setupCardRaycaster() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let pointerDownPos = { x: 0, y: 0 };

            webglCanvas.addEventListener('pointerdown', (e) => {
                pointerDownPos.x = e.clientX;
                pointerDownPos.y = e.clientY;
            });

            webglCanvas.addEventListener('pointerup', (e) => {
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (dist > 6) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(crystalCardMeshes);

                if (intersects.length > 0) {
                    const clickedMesh = intersects[0].object;
                    openCrystalLightbox(clickedMesh.userData.cardData);
                }
            });
        }

        // Lightbox popup for Crystal Card
        const crystalLightbox = document.getElementById('crystal-lightbox');
        const cpIcon = document.getElementById('cp-icon');
        const cpTitle = document.getElementById('cp-title');
        const cpSubtitle = document.getElementById('cp-subtitle');
        const cpMessage = document.getElementById('cp-message');
        const btnCloseCrystal = document.getElementById('btn-close-crystal');

        function openCrystalLightbox(data) {
            cpIcon.textContent = data.icon;
            cpTitle.textContent = data.title;
            cpSubtitle.textContent = data.subtitle;
            cpMessage.textContent = data.message;
            crystalLightbox.classList.add('open');
        }

        btnCloseCrystal.addEventListener('click', () => {
            crystalLightbox.classList.remove('open');
        });
        crystalLightbox.addEventListener('click', (e) => {
            if (e.target === crystalLightbox) {
                crystalLightbox.classList.remove('open');
            }
        });

        // 3D Animation Loop
        function animateGalaxy(timestamp) {
            requestAnimationFrame(animateGalaxy);
            const time = timestamp * 0.001 || 0;

            if (controls) controls.update();

            // Bobbing cards
            for (let mesh of crystalCardMeshes) {
                mesh.position.y = mesh.userData.initialY + Math.sin(time * mesh.userData.bobSpeed + mesh.userData.seed) * 4.5;
            }

            // Bobbing text sprites
            for (let sprite of textSprites) {
                sprite.position.y = sprite.userData.initialY + Math.sin(time * 1.4 + sprite.userData.seed) * 3.5;
            }

            // Spinning & Pulsing hearts
            for (let heart of heartMeshes) {
                heart.rotation.x += heart.userData.rotSpeedX;
                heart.rotation.y += heart.userData.rotSpeedY;
                heart.position.y = heart.userData.initialY + Math.sin(time * 1.8 + heart.userData.seed) * 4;
            }

            // Rotating stardust
            if (starParticles) {
                starParticles.rotation.y = time * 0.035;
                starParticles.rotation.x = Math.sin(time * 0.02) * 0.05;
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        /* =========================================================================
           6. GIAO DIỆN BỨC THƯ TÌNH DÀNH RIÊNG CHO ÁNH TUYẾT
           ========================================================================= */
        const btnLetter = document.getElementById('btn-letter');
        const letterModal = document.getElementById('letter-modal');
        const btnCloseLetter = document.getElementById('btn-close-letter');
        const letterTitleEl = document.getElementById('letter-title-el');
        const letterContentEl = document.getElementById('letter-content-el');
        const letterSigEl = document.getElementById('letter-sig-el');

        let typewriterTimeout = null;

        letterTitleEl.textContent = CONFIG.letter.title;
        letterSigEl.textContent = CONFIG.letter.signature;

        function openLetter() {
            letterModal.classList.add('open');
            startTypewriter();
        }

        function closeLetter() {
            letterModal.classList.remove('open');
            if (typewriterTimeout) {
                clearTimeout(typewriterTimeout);
            }
        }

        function startTypewriter() {
            const text = CONFIG.letter.content;
            letterContentEl.innerHTML = '<span class="typewriter-cursor"></span>';
            letterSigEl.classList.remove('visible');

            let index = 0;
            if (typewriterTimeout) clearTimeout(typewriterTimeout);

            function typeChar() {
                if (index < text.length) {
                    const currentText = text.substring(0, index + 1);
                    letterContentEl.innerHTML = currentText + '<span class="typewriter-cursor"></span>';
                    index++;
                    typewriterTimeout = setTimeout(typeChar, 36 + Math.random() * 20);
                } else {
                    letterContentEl.innerHTML = text;
                    setTimeout(() => {
                        letterSigEl.classList.add('visible');
                    }, 250);
                }
            }

            typewriterTimeout = setTimeout(typeChar, 300);
        }

        btnLetter.addEventListener('click', openLetter);
        btnCloseLetter.addEventListener('click', closeLetter);
        letterModal.addEventListener('click', (e) => {
            if (e.target === letterModal) closeLetter();
        });

    </script>
</body>
</html>
